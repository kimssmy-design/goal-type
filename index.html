<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 어떤 목표 유형일까? 🎯</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap');
:root{--a-bg:#FFF3E0;--a-border:#FF9800;--a-text:#E65100;--b-bg:#E3F2FD;--b-border:#2196F3;--b-text:#0D47A1;--c-bg:#FCE4EC;--c-border:#E91E63;--c-text:#880E4F;--d-bg:#E8F5E9;--d-border:#4CAF50;--d-text:#1B5E20}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);min-height:100vh;padding:20px 16px 40px}
#app{max-width:520px;margin:0 auto}
.card{background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.screen{display:none}.screen.active{display:block}
.start-hero{text-align:center;margin-bottom:24px}
.start-icon{font-size:64px;display:block;margin-bottom:12px}
.start-title{font-size:24px;font-weight:700;color:#1a1a2e;margin-bottom:8px;line-height:1.3}
.start-sub{font-size:15px;color:#555;line-height:1.7}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 28px}
.type-chip{border-radius:12px;padding:12px 10px;text-align:center;font-size:13px;font-weight:700}
.chip-a{background:var(--a-bg);color:var(--a-text);border:2px solid var(--a-border)}
.chip-b{background:var(--b-bg);color:var(--b-text);border:2px solid var(--b-border)}
.chip-c{background:var(--c-bg);color:var(--c-text);border:2px solid var(--c-border)}
.chip-d{background:var(--d-bg);color:var(--d-text);border:2px solid var(--d-border)}
.start-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.5)}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-label{font-size:13px;color:#888;font-weight:500}
.progress-pct{font-size:13px;color:#764ba2;font-weight:700}
.progress-track{width:100%;height:8px;background:#ede7f6;border-radius:99px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .4s ease}
.q-num{display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;margin-bottom:12px}
.q-text{font-size:18px;font-weight:700;color:#1a1a2e;line-height:1.5;margin-bottom:20px}
.choice-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fafafa;border:2px solid #e0e0e0;border-radius:14px;padding:14px 16px;font-family:'Noto Sans KR',sans-serif;font-size:15px;color:#333;cursor:pointer;margin-bottom:10px;transition:border-color .15s,background .15s,transform .1s}
.choice-btn:hover{border-color:#bbb;background:#f0f0f0;transform:translateX(4px)}
.choice-btn.sel-A{background:var(--a-bg);border-color:var(--a-border);color:var(--a-text)}
.choice-btn.sel-B{background:var(--b-bg);border-color:var(--b-border);color:var(--b-text)}
.choice-btn.sel-C{background:var(--c-bg);border-color:var(--c-border);color:var(--c-text)}
.choice-btn.sel-D{background:var(--d-bg);border-color:var(--d-border);color:var(--d-text)}
.choice-label{display:flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:#e0e0e0;font-size:13px;font-weight:700;flex-shrink:0;transition:background .15s,color .15s}
.choice-btn.sel-A .choice-label{background:var(--a-border);color:#fff}
.choice-btn.sel-B .choice-label{background:var(--b-border);color:#fff}
.choice-btn.sel-C .choice-label{background:var(--c-border);color:#fff}
.choice-btn.sel-D .choice-label{background:var(--d-border);color:#fff}
.next-btn{display:block;width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;opacity:.35;pointer-events:none;transition:opacity .2s,transform .15s}
.next-btn.on{opacity:1;pointer-events:auto}
.next-btn.on:hover{transform:translateY(-2px)}
.result-hero{text-align:center;padding:8px 0 20px;border-bottom:2px dashed #eee;margin-bottom:20px}
.result-badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 14px;border-radius:99px;margin-bottom:10px}
.result-emoji{font-size:56px;display:block;margin-bottom:10px}
.result-type{font-size:26px;font-weight:700;margin-bottom:6px}
.result-sub{font-size:14px;color:#888}
.section-title{font-size:13px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.analysis-box{border-radius:14px;padding:18px;margin-bottom:16px;line-height:1.75;font-size:15px}
.analysis-box p{margin-bottom:10px}.analysis-box p:last-child{margin-bottom:0}
.strength-box{border-radius:14px;padding:16px;margin-bottom:16px}
.strength-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.strength-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin-bottom:8px;line-height:1.5}
.strength-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.advice-box{border-radius:14px;padding:18px;margin-bottom:20px}
.advice-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.advice-text{font-size:15px;line-height:1.75}.advice-text strong{font-weight:700}
.score-section{margin-bottom:20px}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-name{width:68px;font-size:13px;font-weight:700;flex-shrink:0}
.score-track{flex:1;height:10px;background:#f0f0f0;border-radius:99px;overflow:hidden}
.score-bar{height:100%;border-radius:99px;transition:width .7s ease}
.score-val{width:28px;font-size:13px;font-weight:700;text-align:right}
.next-activity-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;border:none;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px;text-decoration:none;text-align:center;transition:transform .15s,opacity .15s}
.next-activity-btn:hover{transform:translateY(-2px);opacity:.92}
.retry-btn{display:block;width:100%;padding:15px;background:transparent;color:#764ba2;border:2px solid #764ba2;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
.retry-btn:hover{background:#f3e5f5}
.qr-btn{position:fixed;bottom:28px;right:28px;z-index:9999;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.5);display:flex;align-items:center;justify-content:center}
.qr-overlay{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.qr-overlay.on{display:flex}
.qr-modal{background:#fff;border-radius:24px;padding:32px 28px;text-align:center;max-width:300px;width:88%;box-shadow:0 16px 48px rgba(0,0,0,.3)}
.qr-modal h3{font-size:16px;font-weight:700;color:#1F2937;margin-bottom:6px}
.qr-modal .qr-desc{font-size:12px;color:#9CA3AF;margin-bottom:18px}
.qr-modal #qr-canvas{display:flex;justify-content:center;margin:0 auto 14px}.qr-modal #qr-canvas svg{display:block}
.qr-modal .qr-url-text{font-size:14px;color:#7C3AED;font-weight:700;margin-bottom:18px}
.qr-modal .qr-close-btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;border:none;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="screen-start" class="screen active">
    <div class="card">
      <div class="start-hero">
        <span class="start-icon">🎯</span>
        <p class="start-title">나는 어떤 목표 유형일까?</p>
        <p class="start-sub">20개 질문에 솔직하게 답하면<br>나의 목표 달성 스타일을 알 수 있어요!</p>
      </div>
      <div class="type-grid">
        <div class="type-chip chip-a">🌱 무관심형</div>
        <div class="type-chip chip-b">💭 고민형</div>
        <div class="type-chip chip-c">🔥 행동형</div>
        <div class="type-chip chip-d">🎯 목적형</div>
      </div>
      <button class="start-btn" onclick="startTest()">테스트 시작하기 →</button>
    </div>
  </div>
  <div id="screen-q" class="screen">
    <div class="card">
      <div class="progress-header">
        <span class="progress-label" id="q-meta">1 / 20</span>
        <span class="progress-pct" id="q-pct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="q-num" id="q-num">Q1</span>
      <p class="q-text" id="q-text"></p>
      <div id="choices"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">다음 →</button>
    </div>
  </div>
  <div id="screen-result" class="screen">
    <div class="card">
      <div class="result-hero">
        <span class="result-badge" id="r-badge"></span>
        <span class="result-emoji" id="r-emoji"></span>
        <p class="result-type" id="r-type"></p>
        <p class="result-sub" id="r-sub"></p>
      </div>
      <p class="section-title">분석</p>
      <div class="analysis-box" id="r-analysis"></div>
      <p class="section-title">나의 특징</p>
      <div class="strength-box" id="r-strength"></div>
      <p class="section-title">이렇게 해봐요</p>
      <div class="advice-box" id="r-advice"></div>
      <p class="section-title">유형별 점수</p>
      <div class="score-section" id="score-bars"></div>
      <a class="next-activity-btn" id="next-activity-link" href="life-purpose-card.html">✏️ 다음 활동 → 내 삶의 목적 카드 만들기</a>
      <button class="retry-btn" onclick="resetTest()">↺ 다시 하기</button>
    </div>
  </div>
</div>

<button class="qr-btn" id="qr-open-btn">📱</button>
<div class="qr-overlay" id="qr-overlay">
  <div class="qr-modal">
    <h3>📱 QR코드로 접속하기</h3>
    <p class="qr-desc">QR코드를 스캔하면 바로 접속돼요</p>
